# Publica uma versão nova: ao criar a tag v<versão> (ex.: v1.2.0), roda os testes, gera o
# instalador no Windows e publica em Releases com o .exe e o latest.yml que a atualização
# automática do app lê. A tag tem de bater com o "version" do package.json.
name: Publicar versão

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  instalador:
    needs: testes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Confere a tag com a versão do package.json
        shell: bash
        run: |
          versao=$(node -p "require('./package.json').version")
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $versao do package.json. Mude o package.json (npm version) e crie a tag v$versao."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preparar-python
      - name: Gera o instalador e publica a versão
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
